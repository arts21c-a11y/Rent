<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RENT OPS</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:9px 12px;border:0;border-radius:8px;cursor:pointer}button,.primary{background:#3559e0;color:#fff}input,select,textarea{padding:9px;border:1px solid #ddd;border-radius:8px;margin:4px;width:auto}.danger{color:#c33}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style><body><div id=a></div><script>
const A=document.querySelector('#a');let page='dashboard';
async function api(u,o){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function boot(){if(!await api('/api/me'))return login();home();load()}function login(){A.innerHTML='<div class="wrap" style="max-width:420px;margin-top:12vh"><div class="card"><h1>RENT•OPS</h1><input id=u placeholder="아이디" value="admin"><input id=p type=password placeholder="비밀번호"><button class=primary onclick="doLogin()">로그인</button></div></div>'}async function doLogin(){try{await api('/api/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});boot()}catch(e){alert(e.message)}}function home(){A.innerHTML='<div class=wrap><header class=row style="justify-content:space-between"><h1>RENT•OPS</h1><button onclick="logout()">로그아웃</button></header><nav class=row><button onclick="go(\'dashboard\')">대시보드</button><button onclick="go(\'products\')">제품 관리</button><button onclick="go(\'customers\')">고객 관리</button><button onclick="go(\'rentals\')">대여 관리</button></nav><main id=m></main></div>'}async function go(x){page=x;await load()}async function load(){try{if(page==='dashboard')dash();if(page==='products')products();if(page==='customers')customers();if(page==='rentals')rentals()}catch(e){alert(e.message)}}async function dash(){let d=await api('/api/dashboard');m.innerHTML='<h2>대시보드</h2><div class=grid>'+['전체 장비','준비 중','대여 중','점검 중','수리 중'].map((x,i)=>'<div class=card><small>'+x+'</small><h2>'+[d.total,d.counts['준비 중']||0,d.counts['대여 중']||0,d.counts['점검 중']||0,d.counts['수리 중']||0][i]+'</h2></div>').join('')+'</div><div class=card><h3>반납 지연</h3>'+(d.overdue.length?d.overdue.map(x=>'<p class=danger>'+x.company+' / '+x.name+' · '+x.products+' · '+x.due_date+' · '+x.delay_days+'일 지연</p>').join(''):'지연 장비가 없습니다.')+'</div>'}async function products(){let q=prompt('제품명 또는 S/N 검색','')??'';let a=await api('/api/products?q='+encodeURIComponent(q));m.innerHTML='<h2>제품 관리</h2><div class=card><button onclick="productAdd()">+ 제품 등록</button><table><tr><th>카테고리</th><th>제품명</th><th>S/N</th><th>위치</th><th>상태</th></tr>'+a.map(x=>'<tr><td>'+x.category+'</td><td>'+x.name+'</td><td>'+x.serial_number+'</td><td>'+x.storage_location+'</td><td>'+x.status+'</td></tr>').join('')+'</table></div>'}async function productAdd(){let category=prompt('카테고리: 카메라/렌즈/액세서리'),name=prompt('제품명'),sn=prompt('S/N'),loc=prompt('보관 위치');if(category&&name&&sn&&loc){await api('/api/products',{method:'POST',body:JSON.stringify({category,name,serial_number:sn,storage_location:loc})});products()}}async function customers(){let q=prompt('회사명/이름/전화번호 검색','')??'';let a=await api('/api/customers?q='+encodeURIComponent(q));m.innerHTML='<h2>고객 관리</h2><div class=card><button onclick="customerAdd()">+ 고객 등록</button><table><tr><th>소속</th><th>이름</th><th>전화</th><th>현재 대여</th></tr>'+a.map(x=>'<tr><td>'+x.company+'</td><td>'+x.name+'</td><td>'+x.phone+'</td><td>'+x.current_rentals+'</td></tr>').join('')+'</table></div>'}async function customerAdd(){let company=prompt('소속(회사)'),name=prompt('이름'),phone=prompt('전화번호');if(company&&name&&phone){await api('/api/customers',{method:'POST',body:JSON.stringify({company,name,phone})});customers()}}async function rentals(){let a=await api('/api/rentals');m.innerHTML='<h2>대여 관리</h2><div class=card><button onclick="rentAdd()">+ 대여 등록</button><table><tr><th>고객</th><th>제품</th><th>대여일</th><th>반납 예정일</th><th>상태</th><th></th></tr>'+a.map(x=>'<tr><td>'+x.company+' / '+x.name+'</td><td>'+x.products+'</td><td>'+x.rental_date+'</td><td>'+x.due_date+'</td><td>'+x.derivedStatus+'</td><td>'+(x.returned_at?'완료':'<button onclick="ret('+x.id+')">반납</button>')+'</td></tr>').join('')+'</table></div>'}async function rentAdd(){let cs=await api('/api/customers'),ps=await api('/api/products?status='+encodeURIComponent('준비 중'));let c=prompt('고객 ID: '+cs.map(x=>x.id+'='+x.company+'/'+x.name).join(', ')),ids=prompt('제품 ID(쉼표): '+ps.map(x=>x.id+'='+x.name).join(', '));if(c&&ids){await api('/api/rentals',{method:'POST',body:JSON.stringify({customer_id:+c,product_ids:ids.split(',').map(Number),rental_date:prompt('대여일','2026-10-02'),due_date:prompt('반납 예정일','2026-10-03')})});rentals()}}async function ret(id){let d=prompt('반납 후 상태: 준비 중/점검 중/수리 중','준비 중');await api('/api/rentals/return',{method:'POST',body:JSON.stringify({rental_id:id,actual_return_date:new Date().toISOString().slice(0,10),return_status:d})});rentals()}async function logout(){await api('/api/logout',{method:'POST'});login()}boot();</script></body></html>
